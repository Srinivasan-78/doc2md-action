<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Sketch of the browser converter page: a drop zone, an options panel, a results table and download buttons">
  <rect width="900" height="470" rx="16" fill="#f7f6ff"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- browser chrome -->
    <rect x="30" y="26" width="840" height="418" rx="12" fill="#ffffff" stroke="#c9c5e8" stroke-width="2"/>
    <rect x="30" y="26" width="840" height="38" rx="12" fill="#efecff"/>
    <circle cx="54" cy="45" r="6" fill="#c9c5e8"/><circle cx="74" cy="45" r="6" fill="#c9c5e8"/><circle cx="94" cy="45" r="6" fill="#c9c5e8"/>
    <rect x="120" y="36" width="420" height="19" rx="9" fill="#ffffff" stroke="#d9d5f2"/>
    <text x="134" y="50" font-size="12" font-family="JetBrains Mono, Consolas, monospace" fill="#6f6b8f">yourname.github.io/doc2md-action</text>

    <!-- headline -->
    <text x="60" y="104" font-size="22" font-weight="600" fill="#2c2a4a">Documents in. Markdown out.</text>
    <text x="60" y="128" font-size="13" fill="#6f6b8f">Nothing is uploaded. The work happens inside this tab.</text>

    <!-- drop zone -->
    <rect x="60" y="148" width="470" height="130" rx="12" fill="#faf9ff" stroke="#6b4ee6" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="295" y="196" font-size="17" font-weight="600" fill="#2c2a4a" text-anchor="middle">Drop files, folders or a .zip</text>
    <rect x="196" y="216" width="100" height="30" rx="8" fill="#6b4ee6"/>
    <text x="246" y="236" font-size="13" fill="#ffffff" text-anchor="middle">Choose files</text>
    <rect x="306" y="216" width="110" height="30" rx="8" fill="#ffffff" stroke="#c9c5e8"/>
    <text x="361" y="236" font-size="13" fill="#2c2a4a" text-anchor="middle">Choose a folder</text>

    <!-- options -->
    <rect x="550" y="148" width="290" height="130" rx="12" fill="#faf9ff" stroke="#c9c5e8" stroke-width="2"/>
    <text x="570" y="174" font-size="13" font-weight="600" fill="#6b4ee6">OPTIONS</text>
    <text x="570" y="200" font-size="13" fill="#2c2a4a">OCR</text>
    <rect x="700" y="188" width="120" height="20" rx="6" fill="#ffffff" stroke="#d9d5f2"/>
    <text x="712" y="203" font-size="12" font-family="JetBrains Mono, Consolas, monospace" fill="#6f6b8f">auto</text>
    <text x="570" y="228" font-size="13" fill="#2c2a4a">OCR language</text>
    <rect x="700" y="216" width="120" height="20" rx="6" fill="#ffffff" stroke="#d9d5f2"/>
    <text x="712" y="231" font-size="12" font-family="JetBrains Mono, Consolas, monospace" fill="#6f6b8f">eng</text>
    <text x="570" y="256" font-size="13" fill="#2c2a4a">Compact output</text>
    <rect x="700" y="244" width="20" height="20" rx="5" fill="#6b4ee6"/>
    <path d="M705 254 l4 5 l7 -9" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- results table -->
    <rect x="60" y="298" width="780" height="96" rx="12" fill="#ffffff" stroke="#c9c5e8" stroke-width="2"/>
    <line x1="60" y1="328" x2="840" y2="328" stroke="#e2defb" stroke-width="2"/>
    <text x="80" y="320" font-size="12" font-weight="600" fill="#6f6b8f">Source</text>
    <text x="300" y="320" font-size="12" font-weight="600" fill="#6f6b8f">Kind</text>
    <text x="420" y="320" font-size="12" font-weight="600" fill="#6f6b8f">Pages</text>
    <text x="520" y="320" font-size="12" font-weight="600" fill="#6f6b8f">OCR</text>
    <text x="620" y="320" font-size="12" font-weight="600" fill="#6f6b8f">Tokens</text>
    <text x="740" y="320" font-size="12" font-weight="600" fill="#6f6b8f">Status</text>
    <text x="80" y="352" font-size="12" font-family="JetBrains Mono, Consolas, monospace" fill="#2c2a4a">report.pdf</text>
    <text x="300" y="352" font-size="12" fill="#2c2a4a">pdf</text>
    <text x="420" y="352" font-size="12" fill="#2c2a4a">12</text>
    <text x="520" y="352" font-size="12" fill="#2c2a4a">yes</text>
    <text x="620" y="352" font-size="12" fill="#2c2a4a">4,180</text>
    <text x="740" y="352" font-size="12" font-weight="600" fill="#2f8f5b">done</text>
    <text x="80" y="374" font-size="12" font-family="JetBrains Mono, Consolas, monospace" fill="#2c2a4a">budget.xlsx</text>
    <text x="300" y="374" font-size="12" fill="#2c2a4a">sheet</text>
    <text x="420" y="374" font-size="12" fill="#2c2a4a">3</text>
    <text x="520" y="374" font-size="12" fill="#2c2a4a">no</text>
    <text x="620" y="374" font-size="12" fill="#2c2a4a">910</text>
    <text x="740" y="374" font-size="12" font-weight="600" fill="#2f8f5b">done</text>

    <!-- buttons -->
    <rect x="60" y="406" width="170" height="28" rx="8" fill="#6b4ee6"/>
    <text x="145" y="425" font-size="13" fill="#ffffff" text-anchor="middle">Copy all Markdown</text>
    <rect x="244" y="406" width="140" height="28" rx="8" fill="#ffffff" stroke="#c9c5e8"/>
    <text x="314" y="425" font-size="13" fill="#2c2a4a" text-anchor="middle">Download .zip</text>
    <rect x="398" y="406" width="170" height="28" rx="8" fill="#ffffff" stroke="#c9c5e8"/>
    <text x="483" y="425" font-size="13" fill="#2c2a4a" text-anchor="middle">Download context.md</text>
  </g>
</svg>
